name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/aistudio-nextjs-base

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build